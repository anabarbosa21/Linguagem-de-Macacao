<!DOCTYPE HTML>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 2 - Table</title>
	</head>
	<body>
		<table border="1"width="100%">
			<tr style="background-color:purple;color:white">
				<th>Cabesalho 1</th>
				<th>Cabesalho 2</th>
				<th>Cabesalho 3</th>
			</tr>
			<tr>
				<td style="background-color:#000000;color:#fff">Conteudo 1</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color:yellow;">1</td>
							<td style="background-color:red;color:#fff; text-align:right;">2</td>
						</tr>
						<tr>
							<td style="background-color:blue;color:#fff; text-align:right;">3</td>
							<td style="background-color:greenyellow;">4</td>
						</tr>
					</table>
				</td>
				<td style="background-image:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRUHYXPHJF_asodkoRUEVxmRCYmPxITUxn9Zh9wbop-SQ&s=10');">Conteudo 3</td>
			</tr>
			<tr>
				<td style="background-color:#000000;color:#fff">Conteudo 4</td>
				<td style="background-image:url('https://i.pinimg.com/736x/ed/31/16/ed3116bc184a2e15a888f0849c935e4e.jpg'); text-align:right;">Conteudo 3</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color:orange;text-align:center">5</td>
							<td style="background-color:red;color:#fff; text-align:pink;">6</td>
						</tr>
						<tr>
							<td style="background-color:blue;color:#fff; text-align:right;">7</td>
							<td style="background-color:orange; text-align:center;">8</td>
						</tr>
			</tr>
		</table>
	</body>
</html>
