<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Box Model</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
   <h2>Float</h2>
   <p>Serve para mudar a posição do elemento na tela,
    seguindo seu ancestral mais próximo.
   </p>
   <ul>
        <li>Float: left -> flutua para esquerda</li>
        <li>Float: right -> flutua para direita</li>
        <li>Clear: both -> limpa os estilos anteriores</li>
   </ul>
   <br><br>
   <div>
        <h3>Float: left</h3>
        <p class="esquerda">Um Texto...</p>
        <img class="esquerda" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVJIs8-ZEPVyaU0vci-YbZm2sA2NQHiPdOvkSkceEaAQ&s=10">
   </div>
   <div>
        <h3>Float: right</h3>
        <p class="direita">Um Texto...</p>
        <img class="direita" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVJIs8-ZEPVyaU0vci-YbZm2sA2NQHiPdOvkSkceEaAQ&s=10">
   </div>
   <p class="limpar">Um texto qualquer!</p>
</body>
</html>
