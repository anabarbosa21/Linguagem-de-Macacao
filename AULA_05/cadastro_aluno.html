<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Cadastro de Aluno</title>
	</head>
	<body>
		<header>
			<h1 style="text-align: center">Cadastro de Aluno</h1>
			<hr>
		</header>
		
		<form action="#" method="POST">
			<label for="nome">Nome do Aluno:</label>
			<br>
			<input type="text" id="nome" name="nome" placeholder="Nome do aluno..."minlength="3"maxlength="255" required >
			<br><br>
			
			<label for="ra">Registro do Aluno:</label>
			<br>
			<input type="text" id="ra" name="ra" value="20261015" disabled>
			<br><br>
			
			<label for="email">E-mail do Aluno:</label>
			<br>
			<input type="email" id="nome" name="email" placeholder="E-mail@email.com"required>
			<br><br>
			
			<label for="telefone">Telefone do aluno:</label>
			<br>
			<input type="tel" id="telefone" name="telefone" placeholder="(00)0000-0000"required>
			<br><br>
			
			<label for="data_nacimrnto">Data de nacimrnto:</label>
			<br>
			<input type="date" id="data_nacimrnto" name="data_nacimrnto"max="2007-01-01" required>
			<br><br>
			
			<label for="idade">Idade:</label>
			<br>
			<input type="number" id="idade" name="idade"min="17" max="100" required>
			<br><br>
			
			<label for="genero">Genero:</label>
			<br>
			<input type="radio" id="masculino" name="genero" value="Masculino"required>Masculino
			<br>
			<input type="radio" id="feminino" name="genero" value="femilino">feminino
			<br>
			<input type="radio" id="outros" name="genero" value="outros">Outros
			<br>
			
			<label for="turma">Selecione a turma:</label>
			<br>
			<select  name="turma" id="turma">
				<option value="selesone">Selesone...</option>
				<option value="1EMA">1º EM A</option>
				<option value="1EMA">1º EM B</option>
				<option value="2EMA">2º EM A</option>
				<option value="2EMA">2º EM B</option>
				<option value="3EMA">3º EM A</option>
				<option value="3EMA">3º EM B</option>
			</select>
			<br><br>
			
			<label for="foto">Foto do Aluno</label>
			<br>
			<input type="file" id="foto" name="foto" required>
			<br><br>
			
			<label for="comentarios">Reclamações, comentarios e elogios...</label>
			<br>
			<textarea id="comentarios" name="comentarios" placeholder="Texto..."></textarea>
			<br><br>
			
			<input type="checkbox" id="termos" name="termos"required>Li e aceite os Termos e Condições
			<br>
			<input type="checkbox" id="termos" name="termos">Aceito receber notificações
			<br><br>
			
			<input type="submit" value="Cadastro do aluno">
		</form>
	</body>
</html>
