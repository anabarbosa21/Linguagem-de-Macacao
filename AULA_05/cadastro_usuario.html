<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Cadastro de usuario </title>
	</head>
	<body>
		<!-- Criar o formulario
		<form> - tag de formulario
		atributo "action"aponta para uma pagina
		atributo "methad":
			-GET: pessa os dados pela URL
			-POST: passa os dados pelo corpo
		-->
		<form action="#"method="POST">
		<!-- Label - rotulo do campo-->
			<label>Nome Conpleto:</label>
			<br>
			<!-- INPUT - campo de entrada de dados
				TYPE - tipo do compo
				ID - identificador (para javascript)
				name - identificadorb(para PHP)
				-->
			<input type="text" id="nome"name="nome">
			<br><br>
			
			<!-- INPUT SUBMIT cria um botao -->
			<input type="submit" value="cadastrar">
		</form>
	</body>
</html>
